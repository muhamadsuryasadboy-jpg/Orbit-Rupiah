 S.allocs.push({id:S.nid++,goalId:gid,amount:amt,date,kind:'alokasi',note:cleanNote(note)});persist();return{ok:true}}

const mpOf=(c,ym)=>c.mpc[ym]||(c.mpc[ym]=mp(ym));

function dayStatus(d,c){if(c.dep[d]>0)return 'saved';if(isOffDay(d,c))return 'off';if(d>c.td)return 'future';if(d<c.start)return 'before';if(!mpOf(c,ymOf(d)).cfg)return 'unset';return d===c.td?'today':'missed'}

function agg(){const d={},m={},y={};S.tx.forEach(t=>{const k=t.type==='in'?'i':'o',mo=ymOf(t.date),yy=t.date.slice(0,4);(d[t.date]=d[t.date]||{i:0,o:0})[k]+=t.amount;(m[mo]=m[mo]||{i:0,o:0})[k]+=t.amount;(y[yy]=y[yy]||{i:0,o:0})[k]+=t.amount});return{d,m,y}}

function avgRate(c,days){days=days||30;const from0=addD(c.td,-(days-1)),from=from0<c.start?c.start:from0,span=diffD(c.td,from)+1;let sum=0,n=0;S.tx.forEach(t=>{if(t.date>=from&&t.date<=c.td){sum+=t.type==='in'?t.amount:-t.amount;if(t.type==='in')n++}});return{perDay:span>0?sum/span:0,span,sum,n}}

function insights(c){const out=[],T=totals(),a=agg(),ym=ymOf(c.td),ms=monthStats(ym,c,a);if(!S.tx.length)return['Belum ada transaksi. Catat setoran pertamamu untuk melihat insight.'];

const RANGES=[['7','7 hari',7],['30','30 hari',30],['90','3 bulan',90],['182','6 bulan',182],['365','1 tahun',365],['all','Semua',0]];
function rangeOf(r,c){const n=r==='all'?0:+r;const from=n?addD(c.td,-(n-1)):c.start;return{from,to:c.td,eff:from<c.start?c.start:from}}
function rangeStats(r,c){const g=rangeOf(r,c);let dep=0,wd=0,big=0,days={};S.tx.forEach(t=>{if(t.date>=g.from&&t.date<=g.to){if(t.type==='in'){dep+=t.amount;days[t.date]=1;if(t.amount>big)big=t.amount}else wd+=t.amount}});
 const cn=countDays(g.eff,g.to,c),sd=Object.keys(days).length,span=Math.max(1,diffD(g.to,g.eff)+1),weeks=Math.max(1,span/7),den=cn.schedSaved+cn.missed;
 return Object.assign({},g,{dep,wd,net:dep-wd,sd,avgDay:sd?dep/sd:0,avgWeek:(dep-wd)/weeks,big,span,succ:den?cn.schedSaved/den*100:null},cn)}

 else if(gran==='w'){let f=mondayOf(g.eff);const fl=addD(mondayOf(g.to),-7*25);if(f<fl)f=fl;for(let w=f;w<=g.to;w=addD(w,7)){let i=0,o=0;for(let k=0;k<7;k++){const x=a.d[addD(w,k)];if(x){i+=x.i;o+=x.o}}out.push({l:w.slice(8)+'/'+w.slice(5,7),v:i,v2:o})}}
 else if(gran==='m'){let f=ymOf(g.eff);const fl=addM(ymOf(g.to),-23);if(f<fl)f=fl;for(let m=f;m<=ymOf(g.to);m=addM(m,1)){const x=a.m[m]||{i:0,o:0};out.push({l:BLS[+m.slice(5)-1]+(m.slice(2,4)),v:x.i,v2:x.o,ym:m})}}
 else{for(let y=+g.eff.slice(0,4);y<=+g.to.slice(0,4);y++){const x=a.y[String(y)]||{i:0,o:0};out.push({l:String(y),v:x.i,v2:x.o})}}

function balanceSeries(r,c){const g=rangeOf(r,c),tx=S.tx.slice().sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.id-y.id);const n=diffD(g.to,g.eff)+1,step=Math.max(1,Math.ceil(n/40)),pts=[];let bal=0,k=0;
 const cut=addD(g.eff,-1);while(k<tx.length&&tx[k].date<=cut){bal+=tx[k].type==='in'?tx[k].amount:-tx[k].amount;k++}
 for(let i=0;i<n;i+=step){const d=addD(g.eff,i),end=i+step>=n?g.to:addD(g.eff,i+step-1);while(k<tx.length&&tx[k].date<=end){bal+=tx[k].type==='in'?tx[k].amount:-tx[k].amount;k++}pts.push({l:end.slice(8)+'/'+end.slice(5,7),v:bal})}

function remindDue(now){const r=S.settings.remind,out=[];if(!r.on)return out;const td=ymd(now),hm=pad(now.getHours())+':'+pad(now.getMinutes());if(hm<r.time)return out;const c=mkCtx();
 const st=dayStatus(td,c);if(r.last.daily!==td&&st!=='saved'&&!(r.skipOff&&st==='off'))out.push({k:'daily',title:'Nabung 20K',body:'Waktunya mencatat tabungan hari ini.'});
 if(r.weekly&&now.getDay()===0&&r.last.weekly!==td){let s=0;S.tx.forEach(t=>{if(t.type==='in'&&t.date>=addD(td,-6)&&t.date<=td)s+=t.amount});out.push({k:'weekly',title:'Ringkasan mingguan',body:'Minggu ini kamu berhasil mengumpulkan '+rp(s)+'.'})}
 if(r.monthly&&td===ymOf(td)+'-'+pad(dim(ymOf(td)))&&r.last.monthly!==ymOf(td)){const ms=monthStats(ymOf(td),c);out.push({k:'monthly',title:'Ringkasan bulanan',body:'Bulan ini kamu mengumpulkan '+rp(ms.dep)+' ('+pctTxt(ms.pct)+' dari target).'})}
 return out}
function markFired(items,now){const r=S.settings.remind,td=ymd(now);items.forEach(i=>{r.last[i.k]=i.k==='monthly'?ymOf(td):td});save()}

/* ---------- tema ---------- */
function applyTheme(){const s=S.settings;let t=s.theme;if(t==='system'){try{t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}catch(e){t='dark'}}
 const r=document.documentElement;r.setAttribute('data-theme',t);r.setAttribute('data-ac',s.accent);r.classList.toggle('calm',!!s.calm)}

/* ---------- navigasi ---------- */
function go(t){V.tab=t;V.stack=[];closeSheet(1);render();try{window.scrollTo(0,0)}catch(e){}}
function openPage(p,a){V.stack.push({p,a});try{history.pushState({n:V.stack.length},'')}catch(e){}render();try{window.scrollTo(0,0)}catch(e){}}
function back(){if(V.sheet){closeSheet();return}if(V.stack.length){try{history.back();return}catch(e){}popPage()}}
function popPage(){if(V.stack.length){V.stack.pop();render()}}
function onPop(){if(V.sheet){closeSheet(1);try{history.pushState({n:V.stack.length},'')}catch(e){}return}popPage()}
function openSheet(h){V.sheet=1;$('sh').innerHTML=h;$('ov').classList.add('on');try{history.pushState({s:1},'')}catch(e){}}
function closeSheet(silent){if(!V.sheet)return;V.sheet=null;$('ov').classList.remove('on');$('sh').innerHTML='';CF=null;if(!silent){try{history.back()}catch(e){}}}
function cfm(msg,label,fn,danger){CF=fn;const h=`<h3>Konfirmasi</h3><p>${msg}</p><div class="row" style="margin-top:14px"><button class="btn sec" style="flex:1" onclick="closeSheet()">Batal</button><button class="btn ${danger?'dg':''}" style="flex:1" onclick="doCF()">${label}</button></div>`;
 if(V.sheet){$('sh').innerHTML=h}else openSheet(h)}
function doCF(){const f=CF;CF=null;if(f)f()}

/* ---------- grafik SVG ---------- */
function barChart(d,o){o=o||{};if(!d.length)return'';const W=320,H=o.h||150,pl=34,pb2=18,w=W-pl,n=d.length,mx=Math.max(1,...d.map(x=>Math.max(x.v||0,x.v2||0))),two=d.some(x=>x.v2>0&&o.two!==false),bw=w/n,iw=Math.max(2,bw*(two?.38:.7)),ch=H-pb2-8;
 let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Grafik')}">`;[0,.5,1].forEach(f=>{const y=8+ch*(1-f);s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="currentColor" opacity=".15"/><text x="0" y="${y+3}">${rpS(mx*f)}</text>`});
 const step=Math.ceil(n/8);d.forEach((x,i)=>{const cx=pl+bw*i+bw/2,h1=ch*(x.v||0)/mx,h2=ch*(x.v2||0)/mx;
  if(two){s+=`<rect x="${cx-iw-1}" y="${8+ch-h1}" width="${iw}" height="${h1}" rx="2" fill="var(--ok)"><title>${esc(x.l)}: ${rp(x.v||0)}</title></rect><rect x="${cx+1}" y="${8+ch-h2}" width="${iw}" height="${h2}" rx="2" fill="${o.c2||'var(--bad)'}"><title>${esc(x.l)}: ${rp(x.v2||0)}</title></rect>`}
  else s+=`<rect x="${cx-iw/2}" y="${8+ch-h1}" width="${iw}" height="${h1}" rx="2" fill="var(--ac)"><title>${esc(x.l)}: ${rp(x.v||0)}</title></rect>`;
  if(i%step===0)s+=`<text x="${cx}" y="${H-4}" text-anchor="middle">${esc(x.l)}</text>`});return s+'</svg>'}
function lineChart(d){if(d.length<2)return'';const W=320,H=150,pl=34,ch=H-26,w=W-pl-4,mx=Math.max(1,...d.map(x=>x.v)),mn=Math.min(0,...d.map(x=>x.v)),rg=mx-mn||1;
 const pts=d.map((x,i)=>[pl+w*i/(d.length-1),8+ch*(1-(x.v-mn)/rg)]);let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik saldo">`;
 [0,.5,1].forEach(f=>{const y=8+ch*(1-f);s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="currentColor" opacity=".15"/><text x="0" y="${y+3}">${rpS(mn+rg*f)}</text>`});
 s+=`<polygon points="${pl},${8+ch} ${pts.map(p=>p.join(',')).join(' ')} ${pl+w},${8+ch}" fill="var(--ac)" opacity=".18"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>`;
 const step=Math.ceil(d.length/6);d.forEach((x,i)=>{if(i%step===0||i===d.length-1)s+=`<text x="${pts[i][0]}" y="${H-4}" text-anchor="middle">${esc(x.l)}</text>`});return s+'</svg>'}
function hbars(d){if(!d.length)return'';const tot=d.reduce((a,x)=>a+x.v,0)||1,mx=d[0].v||1;return d.map(x=>`<div class="hbar"><span style="width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.l)}</span><div class="t"><i style="width:${x.v/mx*100}%"></i></div><span class="b" style="min-width:76px;text-align:right">${Math.round(x.v/tot*100)}%</span></div><div class="mu sm" style="margin:-4px 0 4px">${rp(x.v)}</div>`).join('')}

const hd=(t,b)=>`<div class="hd">${b===false?'':'<button onclick="back()" aria-label="Kembali">←</button>'}<h1>${t}</h1></div>`;
const empty=(t,btn)=>`<div class="empty">${t}${btn||''}</div>`;
function txRow(t){const cn=catOf(t.cat).name,inn=t.type==='in';return`<button class="tx" onclick="txDetail(${t.id})"><div class="dot ${inn?'ok':'bad'}">${inn?'+':'−'}</div><div style="flex:1;min-width:0"><div class="b">${esc(cn)}</div><div class="mu sm" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${fmtDate(t.date)}${t.note?' · '+esc(t.note):''}</div></div><div class="b ${inn?'ok':'bad'}">${inn?'+':'−'}${rp(t.amount)}</div></button>`}

function vHome(){const c=mkCtx(),T=totals(),td=c.td,ym=ymOf(td),ms=monthStats(ym,c),st=dayStatus(td,c),xp=xpInfo(c),s=S.settings,ss=streaks(c),fb=freeBal(),al=allocTotal();
 const E=eta(ms.rem,c),goals=S.goals.filter(g=>g.status==='aktif'),ins=insights(c),ml=missions(c).daily;let h='';
 if(LOADERR)h+=`<div class="c ban"><b>Data lama tidak bisa dibaca.</b><p class="sm">${esc(LOADERR)} Salinan mentah disimpan terpisah. Aplikasi dimulai dari data kosong.</p></div>`;

 h+=`<div class="row sp"><div><div class="mu sm">Nabung 20K</div><h1>Halo${s.name?', '+esc(s.name):''}</h1></div><div class="badge">Lv ${xp.level}</div></div>`;
 h+=`<div class="hero"><div class="sm">Saldo tabungan</div><div class="big">${rp(T.bal)}</div>${al>0?`<div class="sm">Saldo bebas ${rp(fb)} · Dialokasikan ke target ${rp(al)}</div>`:''}<div class="g2" style="margin-top:12px"><div><div class="sm">Total setoran</div><b>${rp(T.dep)}</b></div><div><div class="sm">Total penarikan</div><b>${rp(T.wd)}</b></div></div><button class="btn w" style="margin-top:14px;background:var(--tx);color:var(--bg)" onclick="txForm()">+ Tambah Tabungan</button></div>`;
 const dt=dayTxt(st,c);h+=`<div class="c"><div class="row sp"><b>Hari ini · ${fmtDate(td)}</b><span class="badge">${({saved:'✓ Menabung',off:'☾ Libur',today:'Belum menabung',unset:'Belum diatur'})[st]||''}</span></div><p class="sm mu">${dt}</p>${st==='unset'?'<button class="btn sec sm2" onclick="schedForm(\''+ym+'\')">Atur jadwal bulan ini</button>':''}</div>`;
 h+=`<div class="c"><div class="row sp"><b>Target ${ymName(ym)}</b><b>${pctTxt(ms.pct)}</b></div>${pb(ms.pct)}<div class="row sp sm"><span>${rp(ms.dep)} dari ${rp(ms.target)}</span><span class="mu">Sisa ${rp(ms.rem)}</span></div>${ms.rem>0?`<p class="sm mu">${E.date?'Perkiraan tercapai '+fmtDate(E.date)+' (rata-rata 30 hari terakhir).':esc(E.none||'')}</p>`:'<p class="sm ok">Target bulan ini tercapai.</p>'}</div>`;
 h+=`<div class="g3">${kv('Hari menabung',ms.saved)}${kv('Hari libur',ms.off)}${kv('Terlewat',ms.cfg||ms.plan.cfg?ms.missed:'–')}${kv('Rangkaian',ss.cur+' hari')}${kv('Terbaik',ss.best+' hari')}${kv('Belum ditentukan',ms.unset)}</div>`;
 const pr=[['m3','3 bulan',3],['m6','6 bulan',6],['y1','1 tahun',12]].map(x=>{const from=ymd(new Date(NOWF().getFullYear(),NOWF().getMonth()-x[2]+1,1)),d=depSince(from,c),t=periodTarget(x[0]);return`<div class="kv"><span>${x[1]} terakhir</span><b>${pctTxt(t?d/t*100:0)}</b><div class="pb"><i style="width:${Math.min(100,t?d/t*100:0)}%"></i></div><span>${rpS(d)} / ${rpS(t)}</span></div>`}).join('');
 h+=`<h2>Progres jangka panjang</h2><div class="g3">${pr}</div>`;
 h+=`<h2>Target tabungan</h2>`+(goals.length?goals.slice(0,2).map(g=>`<button class="c tx" style="display:block;width:100%" onclick="openPage('goal',${g.id})"><div class="row sp"><b>${esc(g.name)}</b><b>${pctTxt(goalPct(g))}</b></div>${pb(goalPct(g))}<div class="sm mu">${rp(allocSum(g.id))} / ${rp(g.target)}</div></button>`).join(''):empty('Belum ada target tabungan.','<br><button class="btn sec sm2" style="margin-top:8px" onclick="goalForm()">Buat target</button>'));
 h+=`<div class="c"><div class="row sp"><b>Level ${xp.level}</b><span class="sm mu">${xp.cur}/${xp.next} XP</span></div>${pb(xp.cur/xp.next*100)}<p class="sm mu">${xp.ac} pencapaian · ${xp.gd} target selesai · ${xp.mm} bulan tercapai</p></div>`;
 h+=`<h2>Misi hari ini</h2><div class="c">${ml.map(m=>`<div class="row sp sm" style="margin:6px 0"><span>${m.done?'✓':'○'} ${esc(m.t)}${m.note?' <span class="mu">('+esc(m.note)+')</span>':''}</span><span class="mu">${m.done?'Selesai':rpOrN(m)}</span></div>`).join('')}</div>`;

const rpOrN=m=>m.max>=1000?rpS(m.cur)+' / '+rpS(m.max):m.cur+' / '+m.max;

/* ---------- form transaksi ---------- */
function txForm(id,date,type){const t=id?S.tx.find(x=>x.id===id):null,ty=t?t.type:(type||'in');V.f={id:id||0,type:ty};
 openSheet(txFormHtml(t?{amount:t.amount,date:t.date,cat:t.cat,note:t.note}:{amount:S.settings.defAmount,date:date||today(),cat:'',note:''}))}
function txFormHtml(v){const f=V.f,cats=S.cats.filter(c=>c.t===f.type);const cur=cats.some(c=>c.id===v.cat)?v.cat:(f.type==='in'?'c_harian':'c_tarik');
 return`<h3>${f.id?'Ubah transaksi':'Tambah tabungan'}</h3><div class="seg" role="tablist"><button class="${f.type==='in'?'on':''}" onclick="txType('in')">Setoran</button><button class="${f.type==='out'?'on':''}" onclick="txType('out')">Penarikan</button></div>
 <label class="f" for="fa">Nominal (Rp)</label>${moneyIn('fa',v.amount)}<div class="chips">${[10000,20000,50000,100000].map(n=>`<button class="chip" onclick="$('fa').value='${fmtIn(n)}'">${rp(n)}</button>`).join('')}</div>
 <label class="f" for="fd">Tanggal</label><input id="fd" type="date" max="${today()}" value="${v.date}">
 <label class="f" for="fc">Kategori</label><select id="fc">${cats.map(c=>`<option value="${esc(c.id)}" ${c.id===cur?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
 <label class="f" for="fn">Catatan (opsional)</label><input id="fn" maxlength="200" value="${esc(v.note)}" placeholder="Misal: sisa uang jajan">
 <div class="err" id="fe"></div><button class="btn w" onclick="txSave()">Simpan</button>`}
function txType(t){const v={amount:Number((val('fa')||'').replace(/\./g,''))||0,date:val('fd'),cat:'',note:val('fn')};V.f.type=t;$('sh').innerHTML=txFormHtml(v)}
function txSave(){const pm=parseMoney(val('fa'));if(pm.err){$('fe').textContent=pm.err;return}
 const o={type:V.f.type,amount:pm.n,date:val('fd'),cat:val('fc'),note:val('fn')};if(!o.date){$('fe').textContent='Tanggal belum diisi.';return}
 const r=V.f.id?editTx(V.f.id,o):addTx(o);if(!r.ok){$('fe').textContent=r.err;return}closeSheet();toast(V.f.id?'Transaksi diperbarui.':(o.type==='in'?'Setoran tersimpan.':'Penarikan tersimpan.'));render();flushEvents()}
function txDetail(id){const t=S.tx.find(x=>x.id===id);if(!t)return;openSheet(`<h3>Detail transaksi</h3><div class="c"><div class="row sp"><span class="mu">Jenis</span><b>${t.type==='in'?'Setoran':'Penarikan'}</b></div><div class="row sp"><span class="mu">Nominal</span><b class="${t.type==='in'?'ok':'bad'}">${rp(t.amount)}</b></div><div class="row sp"><span class="mu">Tanggal</span><b>${fmtDate(t.date)}</b></div><div class="row sp"><span class="mu">Kategori</span><b>${esc(catOf(t.cat).name)}</b></div><div class="row sp"><span class="mu">Catatan</span><b style="text-align:right">${esc(t.note)||'-'}</b></div></div>
 <div class="row"><button class="btn sec" style="flex:1" onclick="closeSheet();setTimeout(()=>txForm(${id}),50)">Ubah</button><button class="btn dg" style="flex:1" onclick="txDel(${id})">Hapus</button></div>`)}
function txDel(id){cfm('Hapus transaksi ini? Saldo akan dihitung ulang dan tindakan ini tidak bisa dibatalkan.','Hapus',()=>{const r=delTx(id);if(!r.ok){closeSheet();setTimeout(()=>openSheet(`<h3>Tidak bisa dihapus</h3><p>${esc(r.err)}</p><button class="btn w" onclick="closeSheet()">Mengerti</button>`),60);return}closeSheet();toast('Transaksi dihapus.');render()},1)}

/* ---------- daftar transaksi ---------- */
function filtTx(){const f=V.tf;let l=S.tx.filter(t=>(!f.type||t.type===f.type)&&(!f.cat||t.cat===f.cat)&&(!f.month||ymOf(t.date)===f.month)&&(!f.year||t.date.slice(0,4)===f.year)&&(!f.from||t.date>=f.from)&&(!f.to||t.date<=f.to));
 if(f.q){const q=f.q.toLowerCase();l=l.filter(t=>(t.note||'').toLowerCase().includes(q)||catOf(t.cat).name.toLowerCase().includes(q)||String(t.amount).includes(q.replace(/\D/g,'')||'§'))}
 const so={new:(a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id-a.id,old:(a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id,big:(a,b)=>b.amount-a.amount,small:(a,b)=>a.amount-b.amount};return l.sort(so[f.sort]||so.new)}
function pgTx(){const f=V.tf,l=filtTx(),yrs=[...new Set(S.tx.map(t=>t.date.slice(0,4)))].sort().reverse(),mos=[...new Set(S.tx.map(t=>ymOf(t.date)))].sort().reverse(),act=!!(f.type||f.cat||f.month||f.year||f.from||f.to||f.q);
 let h=hd('Riwayat transaksi')+`<input id="tq" placeholder="Cari catatan, kategori, atau nominal" value="${esc(f.q)}" oninput="tfSet('q',this.value,1)" aria-label="Cari">`;
 h+=`<div class="row sp" style="margin-top:8px"><button class="ib" onclick="V.tf.open=!V.tf.open;render()">${V.tf.open?'Tutup filter':'Filter & urutkan'}${act?' •':''}</button>${act?'<button class="ib" onclick="tfReset()">Reset</button>':''}</div>`;
 if(f.open)h+=`<div class="c"><div class="g2"><div><label class="f">Jenis</label><select onchange="tfSet('type',this.value)"><option value="">Semua</option><option value="in" ${f.type==='in'?'selected':''}>Setoran</option><option value="out" ${f.type==='out'?'selected':''}>Penarikan</option></select></div><div><label class="f">Kategori</label><select onchange="tfSet('cat',this.value)"><option value="">Semua</option>${S.cats.map(c=>`<option value="${esc(c.id)}" ${f.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div><label class="f">Bulan</label><select onchange="tfSet('month',this.value)"><option value="">Semua</option>${mos.map(m=>`<option value="${m}" ${f.month===m?'selected':''}>${ymName(m)}</option>`).join('')}</select></div><div><label class="f">Tahun</label><select onchange="tfSet('year',this.value)"><option value="">Semua</option>${yrs.map(m=>`<option ${f.year===m?'selected':''}>${m}</option>`).join('')}</select></div><div><label class="f">Dari tanggal</label><input type="date" value="${f.from}" onchange="tfSet('from',this.value)"></div><div><label class="f">Sampai tanggal</label><input type="date" value="${f.to}" onchange="tfSet('to',this.value)"></div></div><label class="f">Urutkan</label><select onchange="tfSet('sort',this.value)"><option value="new" ${f.sort==='new'?'selected':''}>Terbaru</option><option value="old" ${f.sort==='old'?'selected':''}>Terlama</option><option value="big" ${f.sort==='big'?'selected':''}>Nominal terbesar</option><option value="small" ${f.sort==='small'?'selected':''}>Nominal terkecil</option></select></div>`;

 if(done.length)h+=`<h2>Selesai</h2>`+done.map(goalCard).join('');if(can.length)h+=`<h2>Dibatalkan</h2>`+can.map(goalCard).join('');return h}

/* ---------- SIMULASI ---------- */
function secSim(){const m=V.sim,r=simulate(m.daily,m.days,m.extra,m.months),tt=m.target>0?timeToTarget(m.target,m.daily,m.days,m.extra,today()):null;
 return`<div class="c ban"><span class="badge sim">SIMULASI</span><p class="sm mu">Hanya perhitungan perkiraan. Tidak mengubah saldo, transaksi, atau target aslimu.</p></div><div class="c"><label class="f">Nominal harian (Rp)</label>${moneyIn('s1',m.daily)}<label class="f">Hari menabung per bulan</label><input id="s2" inputmode="numeric" value="${m.days}"><label class="f">Tambahan per bulan (Rp, opsional)</label>${moneyIn('s3',m.extra,'0')}<label class="f">Lama (bulan)</label><input id="s4" inputmode="numeric" value="${m.months}"><label class="f">Target yang ingin dicapai (Rp, opsional)</label>${moneyIn('s5',m.target,'0')}<div class="err" id="fe"></div><button class="btn w" onclick="simRun()">Hitung simulasi</button></div>
 <div class="c"><span class="badge sim">SIMULASI</span><div class="g2" style="margin-top:8px">${kv('Per bulan',rp(r.perMonth))}${kv('Total '+m.months+' bulan',rp(r.total))}</div>${tt?`<p class="sm">Untuk mencapai ${rp(m.target)}: sekitar <b>${dec(tt.months)} bulan</b>${tt.saveDays?' ('+tt.saveDays+' hari menabung)':''}, perkiraan tanggal ${fmtDate(tt.date)}.</p>`:''}</div>`}
function simRun(){const d=parseMoney(val('s1')),dy=Number(val('s2')),ex=val('s3')?parseMoney(val('s3')):{n:0},mo=Number(val('s4')),tg=val('s5')?parseMoney(val('s5')):{n:0};
 if(d.err){$('fe').textContent=d.err;return}if(!Number.isInteger(dy)||dy<1||dy>31){$('fe').textContent='Hari menabung harus 1 sampai 31.';return}if(ex.err&&val('s3')!=='0'){$('fe').textContent='Tambahan: '+ex.err;return}if(!Number.isInteger(mo)||mo<1||mo>600){$('fe').textContent='Lama harus 1 sampai 600 bulan.';return}if(tg.err&&val('s5')!=='0'){$('fe').textContent='Target: '+tg.err;return}
 V.sim={daily:d.n,days:dy,extra:ex.n||0,months:mo,target:tg.n||0};render()}

/* ---------- PENGATURAN ---------- */
const srow=(t,sub,fn)=>`<button class="c tx" style="display:flex;width:100%;margin:6px 0" onclick="${fn}"><div style="flex:1"><div class="b">${t}</div><div class="sm mu">${sub}</div></div><span class="mu">›</span></button>`;
function vSet(){const s=S.settings;let h=hd('Pengaturan',false);
 h+=`<div class="c"><h3>Profil & tabungan</h3><label class="f" for="pn">Nama panggilan</label><input id="pn" maxlength="30" value="${esc(s.name)}" onchange="setName(this.value)"><label class="f" for="pd">Nominal tabungan harian (Rp)</label>${moneyIn('pd',s.daily)}<div class="g2"><div><label class="f" for="pm">Hari menabung/bulan</label><input id="pm" inputmode="numeric" value="${s.daysPerMonth}"></div><div><label class="f" for="po">Hari libur/bulan</label><input id="po" inputmode="numeric" value="${s.offPerMonth}"></div></div><label class="f" for="pa">Nominal bawaan form tambah (Rp)</label>${moneyIn('pa',s.defAmount)}<div class="err" id="fe"></div><button class="btn w" onclick="setSave()">Simpan pengaturan tabungan</button><p class="sm mu">Target bulanan bawaan: ${rp(s.daily*s.daysPerMonth)}. Mengubah ini tidak mengubah saldo atau transaksi lama.</p></div>`;
 h+=`<div class="c"><h3>Target periode</h3><p class="sm mu">Kosongkan untuk memakai hitungan otomatis.</p><label class="f" for="t1">Target bulanan (Rp)</label>${moneyIn('t1',s.targets.m,String(baseMonthly()))}<label class="f" for="t3">Target 3 bulan (Rp)</label>${moneyIn('t3',s.targets.m3,String(periodTarget('m3')))}<label class="f" for="t6">Target 6 bulan (Rp)</label>${moneyIn('t6',s.targets.m6,String(periodTarget('m6')))}<label class="f" for="ty">Target 1 tahun (Rp)</label>${moneyIn('ty',s.targets.y1,String(periodTarget('y1')))}<div class="err" id="fe2"></div><button class="btn w" onclick="tgtSave()">Simpan target periode</button></div>`;
 h+=`<div class="c"><h3>Tampilan</h3><label class="f">Tema</label><div class="seg">${[['dark','Gelap'],['light','Terang'],['system','Sistem']].map(x=>`<button class="${s.theme===x[0]?'on':''}" onclick="setS('theme','${x[0]}')">${x[1]}</button>`).join('')}</div><label class="f">Warna aksen</label><div class="seg">${['biru','ungu','hijau','emas'].map(x=>`<button class="${s.accent===x?'on':''}" onclick="setS('accent','${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><label class="f">Format tanggal</label><div class="seg">${[['id','5 Mar 2026'],['num','05/03/2026'],['iso','2026-03-05']].map(x=>`<button class="${s.dateFmt===x[0]?'on':''}" onclick="setS('dateFmt','${x[0]}')">${x[1]}</button>`).join('')}</div><label class="row" style="margin-top:12px"><input type="checkbox" ${s.calm?'checked':''} onchange="setS('calm',this.checked)"> Kurangi animasi</label></div>`;
 h+=srow('Kategori','Atur kategori setoran dan penarikan',"openPage('cats')")+srow('Pengingat','Pengingat lokal '+(s.remind.on?'(aktif)':'(mati)'),"openPage('remind')")+srow('Backup & data','Ekspor JSON/CSV, impor, hapus semua data',"openPage('backup')")+srow('Riwayat transaksi','Cari, filter, urutkan',"openPage('tx')")+srow('Bantuan','Cara memakai, tanya jawab',"openPage('help')")+srow('Tentang','Privasi dan versi',"openPage('about')");return h}
function setName(v){S.settings.name=String(v).trim().slice(0,30);persist();toast('Nama disimpan.')}
function setS(k,v){S.settings[k]=v;persist();applyTheme();render()}
function setSave(){const d=parseMoney(val('pd')),a=parseMoney(val('pa')),dm=Number(val('pm')),op=Number(val('po'));const e=$('fe');if(d.err){e.textContent='Nominal harian: '+d.err;return}if(a.err){e.textContent='Nominal bawaan: '+a.err;return}if(!Number.isInteger(dm)||dm<1||dm>31){e.textContent='Hari menabung harus 1 sampai 31.';return}if(!Number.isInteger(op)||op<0||op>30){e.textContent='Hari libur harus 0 sampai 30.';return}
 S.settings.daily=d.n;S.settings.defAmount=a.n;S.settings.daysPerMonth=dm;S.settings.offPerMonth=op;persist();toast('Pengaturan tersimpan.');render()}
function tgtSave(){const ks=[['t1','m'],['t3','m3'],['t6','m6'],['ty','y1']],o={};for(const k of ks){const v=val(k[0]).trim();if(!v){o[k[1]]=null;continue}const p=parseMoney(v);if(p.err){$('fe2').textContent=p.err;return}o[k[1]]=p.n}Object.assign(S.settings.targets,o);persist();toast('Target disimpan.');render()}

/* ---------- halaman lain ---------- */
function pgCats(){let h=hd('Kategori');[['in','Setoran'],['out','Penarikan']].forEach(x=>{h+=`<h2>${x[1]}</h2><div class="c">${S.cats.filter(c=>c.t===x[0]).map(c=>`<div class="row sp" style="padding:6px 0"><span>${esc(c.name)} ${c.b?'<span class="badge">bawaan</span>':''}</span>${c.b?'':`<button class="ib" onclick="catDel('${esc(c.id)}')">Hapus</button>`}</div>`).join('')}</div>`});
 return h+`<div class="c"><h3>Kategori baru</h3><input id="cn" maxlength="30" placeholder="Nama kategori"><div class="seg" style="margin-top:8px"><button id="ci" class="on" onclick="V.f.ct='in';$('ci').classList.add('on');$('co').classList.remove('on')">Setoran</button><button id="co" onclick="V.f.ct='out';$('co').classList.add('on');$('ci').classList.remove('on')">Penarikan</button></div><div class="err" id="fe"></div><button class="btn w" onclick="catAdd()">Tambah</button></div>`}
function catAdd(){const r=addCat(val('cn'),V.f.ct||'in');if(!r.ok){$('fe').textContent=r.err;return}toast('Kategori ditambahkan.');V.f.ct='in';render()}
function catDel(id){cfm('Hapus kategori ini? Transaksi yang memakainya dipindah ke kategori bawaan.','Hapus',()=>{const r=delCat(id);closeSheet();toast(r.ok?'Kategori dihapus.':r.err);render()},1)}
function pgRemind(){const r=S.settings.remind,sup=typeof Notification!=='undefined',perm=sup?Notification.permission:'tidak didukung';
 const ck=(k,t)=>`<label class="row" style="margin:10px 0"><input type="checkbox" ${r[k]?'checked':''} onchange="remSet('${k}',this.checked)"> ${t}</label>`;
 return hd('Pengingat')+`<div class="c ban"><b>Cara kerja pengingat</b><p class="sm mu">Pengingat berjalan di dalam aplikasi, hanya saat aplikasi sedang terbuka. Versi web murni tidak bisa membunyikan notifikasi saat aplikasi tertutup. Kalau dibungkus jadi APK dengan Capacitor, notifikasi terjadwal bisa ditambahkan lewat plugin (belum ada di versi ini).</p></div><div class="c">${ck('on','Aktifkan pengingat harian')}<label class="f" for="rt">Jam pengingat</label><input id="rt" type="time" value="${r.time}" onchange="remSet('time',this.value)">${ck('skipOff','Jangan ingatkan di hari libur')}${ck('weekly','Ringkasan mingguan (hari Minggu)')}${ck('monthly','Ringkasan bulanan (akhir bulan)')}</div><div class="c"><b>Izin notifikasi:</b> ${perm==='granted'?'diizinkan':perm==='denied'?'ditolak (ubah di pengaturan browser/HP)':perm==='default'?'belum diminta':'tidak didukung di perangkat ini'}<div class="row" style="margin-top:10px"><button class="btn sec" style="flex:1" onclick="remAsk()">Minta izin</button><button class="btn sec" style="flex:1" onclick="remTest()">Tes pengingat</button></div><p class="sm mu">Jika izin tidak ada, pengingat tampil sebagai pesan di dalam aplikasi.</p></div>`}
function remSet(k,v){S.settings.remind[k]=v;persist();if(k==='on'&&v&&typeof Notification!=='undefined'&&Notification.permission==='default')remAsk();render()}
function remAsk(){if(!(typeof Notification!=='undefined')){toast('Notifikasi tidak didukung di perangkat ini.');return}try{const p=Notification.requestPermission();if(p&&p.then)p.then(()=>render())}catch(e){toast('Gagal meminta izin.')}}
function notify(t,b){try{if(typeof Notification!=='undefined'&&Notification.permission==='granted'){new Notification(t,{body:b});return}}catch(e){}toast(t+': '+b)}
function remTest(){notify('Nabung 20K','Ini tes pengingat. Sudah catat tabungan hari ini?')}
function remCheck(){try{if(!S||!S.settings.remind.on)return;const items=remindDue(NOWF());if(items.length){items.forEach(i=>notify(i.title,i.body));markFired(items,NOWF())}}catch(e){}}
function pgBackup(){const n=S.tx.length;return hd('Backup & data')+`<div class="c"><b>Data ada di perangkat ini saja</b><p class="sm mu">Tidak ada akun, server, atau cloud. ${n} transaksi, ${S.goals.length} target tersimpan di penyimpanan browser/aplikasi. Kalau data aplikasi dihapus atau perangkat diganti, data hilang kecuali kamu punya backup.</p></div>
 <div class="c"><h3>Ekspor</h3><div class="row"><button class="btn" style="flex:1" onclick="dl('json')">Unduh JSON</button><button class="btn sec" style="flex:1" onclick="dl('csv')" ${n?'':'disabled'}>Unduh CSV</button></div><button class="btn sec w" style="margin-top:8px" onclick="copyBk()">Salin backup JSON</button><p class="sm mu">Kalau unduhan tidak jalan di aplikasimu, pakai Salin lalu tempel ke catatan/chat sendiri.</p></div>
 <div class="c"><h3>Impor</h3><p class="sm mu">Mengimpor akan <b>menimpa semua data</b> saat ini. Backup dulu kalau perlu.</p><input type="file" accept=".json,application/json" onchange="impFile(this)"><label class="f" for="ip">Atau tempel isi backup JSON</label><textarea id="ip" rows="4" placeholder="Tempel di sini"></textarea><div class="err" id="fe"></div><button class="btn sec w" onclick="impText()">Periksa data</button></div>
 <div class="c"><h3>Hapus semua data</h3><p class="sm mu">Menghapus transaksi, target, jadwal, dan pengaturan di perangkat ini.</p><button class="btn dg w" onclick="wipeForm()">Hapus semua data</button></div>`}
function dl(k){try{const txt=k==='json'?exportJSON():exportCSV(),b=new Blob([txt],{type:k==='json'?'application/json':'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nabung20k-'+today()+'.'+k;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Berkas disiapkan. Cek folder Unduhan.')}catch(e){toast('Unduhan tidak didukung di sini. Pakai Salin backup.')}}
function copyBk(){const t=exportJSON();try{navigator.clipboard.writeText(t).then(()=>toast('Backup disalin.'),()=>fbCopy(t))}catch(e){fbCopy(t)}}
function fbCopy(t){try{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Backup disalin.')}catch(e){toast('Gagal menyalin.')}}
function impFile(el){const f=el.files&&el.files[0];if(!f)return;if(f.size>5e6){$('fe').textContent='File terlalu besar.';return}const r=new FileReader();r.onload=()=>impCheck(String(r.result));r.onerror=()=>{$('fe').textContent='File tidak bisa dibaca.'};r.readAsText(f)}
function impText(){impCheck(val('ip'))}
function impCheck(t){const r=parseBackup(t);if(r.err){$('fe').textContent='Impor dibatalkan: '+r.err.slice(0,3).join(' ');return}const d=r.data;V.f.imp=d;openSheet(`<h3>Data valid</h3><p>Berisi <b>${d.tx.length}</b> transaksi dan <b>${d.goals.length}</b> target. Mengimpor akan <b>menimpa semua data</b> yang ada sekarang (${S.tx.length} transaksi). Lanjutkan?</p><div class="row"><button class="btn sec" style="flex:1" onclick="closeSheet()">Batal</button><button class="btn dg" style="flex:1" onclick="impDo()">Timpa data</button></div>`)}
function impDo(){const d=V.f.imp;V.f.imp=null;if(!d)return;applyBackup(d);closeSheet();V.stack=[];toast('Data berhasil diimpor.');applyTheme();render()}
function wipeForm(){openSheet(`<h3>Hapus semua data?</h3><p>Semua data hilang permanen dari perangkat ini. Ketik <b>HAPUS</b> untuk melanjutkan.</p><input id="wp" placeholder="HAPUS" autocomplete="off"><div class="err" id="fe"></div><div class="row"><button class="btn sec" style="flex:1" onclick="closeSheet()">Batal</button><button class="btn dg" style="flex:1" onclick="wipeDo()">Hapus</button></div>`)}
function wipeDo(){if(val('wp').trim()!=='HAPUS'){$('fe').textContent='Ketik HAPUS dengan huruf besar.';return}wipeAll();closeSheet();V.stack=[];V.tab='home';applyTheme();toast('Semua data dihapus.');render()}
function pgHelp(){const q=(a,b)=>`<details class="c"><summary>${a}</summary><p class="sm">${b}</p></details>`;return hd('Bantuan')+q('Cara mulai','Atur nominal harian di Pengaturan, lalu tekan Tambah Tabungan setiap kali kamu benar-benar menyisihkan uang. Saldo hanya berubah dari transaksi yang kamu catat.')+q('Kenapa saldo tidak bertambah sendiri?','Aplikasi tidak menghubungi bank dan tidak menebak. Target Rp20.000/hari hanyalah patokan, bukan uang yang sudah ada.')+q('Apa itu hari libur?','Hari yang kamu pilih sendiri untuk tidak menabung. Hari libur tidak memutus rangkaian dan tidak dihitung terlewat. Minggu tidak otomatis libur.')+q('Kapan hari dianggap terlewat?','Hanya setelah hari berakhir, hari itu terjadwal (bukan libur), jadwal bulannya sudah kamu atur, dan tidak ada setoran. Hari depan tidak pernah dianggap gagal.')+q('Apa bedanya target dan saldo?','Mengalokasikan dana ke target hanya membagi saldo yang ada. Total saldo tidak berubah, dan dana tidak dihitung dua kali.')+q('Backup','Di Pengaturan > Backup & data, unduh JSON secara berkala. Simpan di tempat aman.')+q('Pengingat','Pengingat hanya berbunyi saat aplikasi terbuka. Lihat halaman Pengingat untuk detailnya.')}
function pgAbout(){return hd('Tentang')+`<div class="c"><h3>Nabung 20K</h3><p class="sm">Versi 1.0 · aplikasi tabungan harian bertema galaksi.</p><p class="sm mu">Semua data disimpan lokal di perangkatmu. Tidak ada akun, server, iklan, pelacakan, atau kunci API. Aplikasi tidak menyentuh uang sungguhan dan tidak terhubung ke bank atau dompet digital: ini hanya pencatat.</p></div>`}

/* ---------- event, render, init ---------- */
function flushEvents(){if(!EVQ.length||V.sheet)return;const e=EVQ.shift(),m={ach:'Pencapaian terbuka: '+e.t,met:'Target bulanan tercapai: '+e.t,goal:'Target tercapai: '+e.t};toast(m[e.k]||'Selamat!');if(EVQ.length)setTimeout(flushEvents,3400)}
const TABS=[['home','Beranda'],['cal','Kalender'],['stat','Statistik'],['goal','Target'],['set','Pengaturan']],TIC={home:'home',cal:'cal',stat:'chart',goal:'flag',set:'gear'};
function renderTab(t){return({home:vHome,cal:vCal,stat:vStat,goal:vGoal,set:vSet})[t]()}
function renderPage(x){return({tx:pgTx,cats:pgCats,remind:pgRemind,backup:pgBackup,help:pgHelp,about:pgAbout,goal:()=>pgGoal(x.a)})[x.p]()}
function render(){if(!S.settings.onboarded){V.f.ob=V.f.ob||0;onbRender();return}let h;try{h=V.stack.length?renderPage(V.stack[V.stack.length-1]):renderTab(V.tab)}catch(e){h=`<div class="c bad">Terjadi kesalahan saat menampilkan halaman: ${esc(e&&e.message)}</div>`}
 const a=$('app');a.innerHTML=h;const nv=$('nav');nv.innerHTML='<div class="in">'+TABS.map(t=>`<button class="${t[0]===V.tab?'on':''}" onclick="go('${t[0]}')" aria-label="${t[1]}">${ic(TIC[t[0]])}${t[1]}</button>`).join('')+'</div>';nv.style.display=(!S.settings.onboarded)?'none':''}
/* onboarding */
function onbRender(){const s=V.f.ob||0;const steps=[`<h1>Selamat datang di Nabung 20K</h1><p class="mu">Catat tabungan harianmu dan lihat kemajuannya di langit malam. Semua data tersimpan di perangkatmu saja.</p><label class="f" for="on">Nama panggilan (opsional)</label><input id="on" maxlength="30" placeholder="Misal: Rina">`,`<h1>Atur targetmu</h1><p class="mu">Bisa diubah kapan saja di Pengaturan.</p><label class="f" for="od">Nominal tabungan harian (Rp)</label>${moneyIn('od',S.settings.daily)}<label class="f" for="om">Hari menabung per bulan</label><input id="om" inputmode="numeric" value="${S.settings.daysPerMonth}"><div class="err" id="fe"></div>`,`<h1>Cara kerjanya</h1><p>• Saldo hanya berubah dari setoran yang kamu catat.</p><p>• Hari libur kamu tentukan sendiri di Kalender.</p><p>• Tidak ada hukuman kalau absen. Hari yang belum terjadi tidak pernah dianggap gagal.</p><p>• Backup data secara berkala di Pengaturan.</p>`];
 $('app').innerHTML=`<div style="padding-top:8vh">${steps[s]}<div class="row" style="margin-top:20px">${s>0?'<button class="btn sec" style="flex:1" onclick="onbGo(-1)">Kembali</button>':''}<button class="btn" style="flex:1" onclick="onbGo(1)">${s===2?'Mulai menabung':'Lanjut'}</button></div><p class="sm mu" style="text-align:center">${s+1} dari 3</p></div>`;$('nav').style.display='none'}
function onbGo(d){const s=V.f.ob||0;if(d>0){if(s===0)S.settings.name=val('on').trim().slice(0,30);if(s===1){const p=parseMoney(val('od')),m=Number(val('om'));if(p.err){$('fe').textContent=p.err;return}if(!Number.isInteger(m)||m<1||m>31){$('fe').textContent='Hari menabung harus 1 sampai 31.';return}S.settings.daily=p.n;S.settings.defAmount=p.n;S.settings.daysPerMonth=m;S.settings.offPerMonth=Math.max(0,30-m)}
  if(s===2){S.settings.onboarded=true;persist();V.tab='home';render();return}}V.f.ob=Math.max(0,s+d);onbRender()}
function boot(){init();applyTheme();try{history.replaceState({n:0},'')}catch(e){}window.addEventListener('popstate',onPop);
 try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',applyTheme)}catch(e){}
 if(S.settings.onboarded)render();else onbRender();setInterval(remCheck,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){remCheck();if(!V.sheet&&!V.stack.length&&S.settings.onboarded)render()}});setTimeout(remCheck,2000)}

boot();</script></body></html>
